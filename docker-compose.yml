services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tbm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tbm_password}
      POSTGRES_DB: ${POSTGRES_DB:-tbm}
    volumes:
      - tbm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tbm} -d ${POSTGRES_DB:-tbm}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tbm}:${POSTGRES_PASSWORD:-tbm_password}@db:5432/${POSTGRES_DB:-tbm}?schema=public
      MASTER_KEY: ${MASTER_KEY:-change-me-please-32bytes-minimum-secret}
      PORT: "4000"
      TBM_SEED: "true"
      # Default to the offline mock upstream so the stack runs without a real key.
      # Set to "openai" and provide OPENAI_API_KEY for real calls.
      TBM_PROXY_UPSTREAM: ${TBM_PROXY_UPSTREAM:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      TBM_PUBLIC_URL: ${TBM_PUBLIC_URL:-http://localhost:4000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12

  dashboard:
    build: ./dashboard
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  tbm_pgdata:
