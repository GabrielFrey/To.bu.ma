<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Token Budget Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- budget cap line -->
  <line x1="128" y1="168" x2="384" y2="168" stroke="#fbbf24" stroke-width="16" stroke-linecap="round"/>
  <!-- spend bars (green under, slate mid, red pressing the cap) -->
  <rect x="140" y="300" width="60" height="88" rx="16" fill="#34d399"/>
  <rect x="226" y="232" width="60" height="156" rx="16" fill="#cbd5e1"/>
  <rect x="312" y="184" width="60" height="204" rx="16" fill="#f87171"/>
</svg>
