server {
  listen 80;
  server_name _;

  # Serve the built SPA.
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API + health to the backend service (same-origin, so no CORS needed).
  location /v1/ {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Required for streaming (SSE) proxy passthrough.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }
  location = /health { proxy_pass http://backend:4000/health; }
  location = /ready { proxy_pass http://backend:4000/ready; }

  location / {
    try_files $uri /index.html;
  }
}
