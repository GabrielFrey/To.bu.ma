project_id = "sticker-studio"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 200

[db]
port = 54322
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "15MiB"

[auth]
enabled = true
site_url = "stickers://"
additional_redirect_urls = ["stickers://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false

[functions.generate-sticker]
verify_jwt = true

[functions.suggest-idea]
verify_jwt = true

[functions.moderate]
verify_jwt = true

[functions.export-pack]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.support-message]
verify_jwt = true

# RevenueCat signs with its own shared secret, so Supabase JWT verification is off.
[functions.revenuecat-webhook]
verify_jwt = false
