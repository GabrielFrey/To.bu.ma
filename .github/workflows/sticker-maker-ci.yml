name: sticker-maker CI

on:
  push:
    branches: [main]
    paths:
      - 'sticker-maker/**'
      - '.github/workflows/sticker-maker-ci.yml'
  pull_request:
    paths:
      - 'sticker-maker/**'
      - '.github/workflows/sticker-maker-ci.yml'

defaults:
  run:
    working-directory: sticker-maker

jobs:
  app:
    name: typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sticker-maker/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --ci

  functions:
    name: edge functions typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck Edge Functions
        working-directory: sticker-maker/supabase/functions
        run: deno check */index.ts

  database:
    name: migrations and pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        working-directory: sticker-maker
        run: supabase start

      - name: Run database tests
        working-directory: sticker-maker
        run: supabase test db

      - name: Stop Supabase
        if: always()
        working-directory: sticker-maker
        run: supabase stop --no-backup
